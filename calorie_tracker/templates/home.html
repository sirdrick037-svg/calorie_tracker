{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <metaname="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Calorie Counter
        {% endblock %}
    </title>

    <link
        rel="stylesheet" href="{% static 'css/tailwind.css' %}">

</head>
<body class="min-h-screen bg-gray-100 text-gray-800">

    <nav class="bg-indigo-600 shadow-lg">

        <div class="mx-auto max-w-5xl px-4">

            <div class="flex h-16 items-center justify-between">

                <a href="{% url 'home' %}" class="text-xl font-bold text-white">
                    Calorie Counter
                </a>


                <a
                    href="{% url 'add_food' %}"
                    class="rounded-lg bg-white px-4 py-2 font-semibold text-indigo-600 transition hover:bg-gray-100"
                >
                    + Add Food
                </a>

            </div>

        </div>

    </nav>


    <main class="mx-auto max-w-5xl px-4 py-8">

        {% if messages %}

            {% for message in messages %}

                <div
                    class="mb-6 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700"
                >
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        {% block content %}

        {% endblock %}

    </main>


    <footer class="mt-12 border-t bg-white">

        <div
            class="mx-auto max-w-5xl px-4 py-6 text-center text-sm text-gray-500"
        >
            Calorie Counter
        </div>

    </footer>


</body>

</html>
